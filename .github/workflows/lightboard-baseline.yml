name: Lightboard baseline build

# Manual only. No model requests, deployment, schedule, cache, or paid runner.
on:
  workflow_dispatch:
    inputs:
      save_firmware:
        description: 'Save a 1-day download ONLY after verifying free artifact allowance and a spending stop'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: lightboard-baseline
  cancel-in-progress: false

jobs:
  compile:
    # This check is evaluated before allocating a runner; private copies do not run.
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: Week-8/LightBoard_Prompter
    steps:
      - name: Check out only the build inputs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: Week-8/LightBoard_Prompter/cloud

      - name: Verify the preserved source and libraries
        run: python3 cloud/build.py --verify-only

      - name: Install the pinned Arduino CLI
        uses: arduino/setup-arduino-cli@81d310742121c928ea9c8bbd407b4217b432ae02 # v2
        with:
          version: '1.5.1'

      - name: Compile the baseline with the pinned core
        run: python3 cloud/build.py --install-core

      - name: Save a short-lived firmware download
        if: ${{ success() && inputs.save_firmware }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: lightboard-baseline-${{ github.run_id }}-${{ github.run_attempt }}
          path: Week-8/LightBoard_Prompter/.build/artifact/
          if-no-files-found: error
          retention-days: 1
          include-hidden-files: false
