name: Publish GitHub Pages projects

on:
  push:
    branches: [main]
    paths:
      - 'Week-6/Experiments/Experiment-03/**'
      - 'Week-6/Experiments/Experiment-06-Flock-Clock/**'
      - 'Week-8/image borkilator/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Assemble site
        shell: bash
        run: |
          set -euo pipefail
          # Preserve the other existing Pages URLs from the last manual deployment.
          # Experiments 03/06 and borkilator come from their source folders on main.
          git fetch --depth=1 origin 5cff6ab1d996dd769b3b6ac808321218375af4f3
          mkdir _site
          git archive 5cff6ab1d996dd769b3b6ac808321218375af4f3 | tar --exclude='.DS_Store' -x -C _site
          rm -rf _site/experiment-03
          mkdir _site/experiment-03
          rsync -a --exclude='tests/' --exclude='README.md' --exclude='PUBLISHING.md' --exclude='.DS_Store' Week-6/Experiments/Experiment-03/ _site/experiment-03/
          # Publish only runtime files; keep development and process records out.
          rm -rf _site/borkilator
          mkdir _site/borkilator
          for file in index.html style.css app.js engine.js worker.js; do
            cp "Week-8/image borkilator/$file" "_site/borkilator/$file"
          done
          # Keep the original clock at the root; publish the independent variation here.
          rm -rf _site/experiment-06
          mkdir _site/experiment-06
          for file in index.html style.css clock.js; do
            cp "Week-6/Experiments/Experiment-06-Flock-Clock/$file" "_site/experiment-06/$file"
          done
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
