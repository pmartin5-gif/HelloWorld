name: Lightboard prompt build
run-name: ${{ inputs.queue_job_id != '' && format('Lightboard queue {0} {1}', inputs.queue_job_id, inputs.queue_dispatch_id) || 'Lightboard manual prompt build' }}

# Manual prompt preparation/publication. Device delivery remains separately armed.
on:
  workflow_dispatch:
    inputs:
      prompt:
        description: 'Creative prompt for the Lightboard (public workflow; maximum 2000 characters)'
        type: string
        required: true
        default: An overflowing heart that keeps giving
      publish:
        description: 'Publish verified OTA assets/feed after checking free use and the $0 stop; no device install'
        type: boolean
        required: true
        default: false
      reuse_saved_generation:
        description: 'Reuse the saved heart test response to check the build without another API call'
        type: boolean
        required: true
        default: true
      queue_job_id:
        description: 'Optional queue job ID; queue requests enforce saved reuse and no publication'
        type: string
        default: ''
      queue_dispatch_id:
        description: 'Queue dispatch reservation ID; leave blank for manual builds'
        type: string
        default: ''
      queue_prompt_sha256:
        description: 'Exact UTF-8 prompt checksum for a queued build'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: lightboard-api-test
  cancel-in-progress: false

jobs:
  generate-and-compile:
    if: ${{ github.repository == 'pmartin5-gif/HelloWorld' && github.event.repository.private == false && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    defaults:
      run:
        working-directory: Week-8/LightBoard_Prompter
    env:
      LB_QUEUE_JOB_ID: ${{ inputs.queue_job_id }}
      LB_QUEUE_DISPATCH_ID: ${{ inputs.queue_dispatch_id }}
      LB_QUEUE_PROMPT_SHA256: ${{ inputs.queue_prompt_sha256 }}
      LB_PUBLISH: ${{ inputs.publish }}
      LB_REUSE: ${{ inputs.reuse_saved_generation }}
    steps:
      - name: Check out only Lightboard inputs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /Week-8/LightBoard_Prompter/cloud/
            /Week-8/LightBoard_Prompter/device/
            /Week-8/LightBoard_Prompter/generate_candidate.py
            /Week-8/LightBoard_Prompter/generationBrief.md
            /Week-8/LightBoard_Prompter/experiments/flash-lite/2026-11-09/cloud-run-42735010470/generation.json

      - name: Save prompt and verify queue binding
        env:
          CREATIVE_PROMPT: ${{ inputs.prompt }}
        run: python3 cloud/queue_binding.py prepare

      - name: Verify the pinned foundation and libraries
        run: python3 cloud/build.py --verify-only

      - name: Install the pinned Arduino CLI
        uses: arduino/setup-arduino-cli@81d310742121c928ea9c8bbd407b4217b432ae02 # v2
        with:
          version: '1.5.1'

      - name: Reuse the saved generation without an API request
        if: ${{ inputs.reuse_saved_generation }}
        run: >-
          python3 cloud/scene.py --reuse-record
          --record experiments/flash-lite/2026-11-09/cloud-run-42735010470/generation.json
          --output .build/generated/generation.json
          --prompt-file .build/generated/creative-prompt.txt --brief generationBrief.md

      - name: Generate one restState using the saved brief
        if: ${{ !inputs.reuse_saved_generation && inputs.queue_job_id == '' && inputs.queue_dispatch_id == '' && inputs.queue_prompt_sha256 == '' }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: >-
          python3 generate_candidate.py --actions-secret --log-result
          --prompt-file .build/generated/creative-prompt.txt
          --output .build/generated/generation.json

      - name: Validate the generated function
        run: >-
          python3 cloud/scene.py --record .build/generated/generation.json
          --output .build/generated/restState.cpp

      - name: Set up the pinned ESP32 toolchain
        run: python3 cloud/build.py --install-core --install-only

      - name: Compile prompt and recovery against the sealed OTA foundation
        run: >-
          python3 cloud/prompt_build.py --cli arduino-cli --data-dir .build/arduino-data
          --work .build/prompt-ota --generation-record .build/generated/generation.json
          --prompt-file .build/generated/creative-prompt.txt

      - name: Publish verified OTA assets and feed
        if: ${{ success() && inputs.publish && inputs.queue_job_id == '' && inputs.queue_dispatch_id == '' && inputs.queue_prompt_sha256 == '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 cloud/ota_publish.py --publish --output .build/prompt-ota/package

      - name: Record package state without claiming installation
        if: ${{ success() }}
        run: |
          python3 - <<'PY_SUMMARY'
          import json, os
          from pathlib import Path
          m = json.loads(Path('.build/prompt-ota/package/manifest.json').read_text())
          print(json.dumps(m, indent=2))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write('## Lightboard prompt OTA package\n\n')
              out.write('Published: ' + str(m['published']) + '. Automatic updates: false.\n\n')
              out.write('Foundation: `' + m['foundation_id'] + '`.\n\n')
              out.write('Commit: `' + m['build']['commit_sha'] + '`.\n\n')
              out.write('Version: `' + m['current']['version'] + '`.\n\n')
              out.write('Application: ' + str(m['current']['bytes']) + ' bytes; SHA-256: `' + m['current']['sha256'] + '`.\n\n')
              out.write('Model request in this run: ' + str(m['generation']['model_request_in_this_run']) + '.\n\n')
              out.write('No device command, Actions artifact or cache. Publication does not confirm installation.\n')
          PY_SUMMARY

      - name: Record queue result
        if: ${{ always() && inputs.queue_job_id != '' }}
        env:
          LB_BUILD_OUTCOME: ${{ job.status }}
        run: python3 cloud/queue_binding.py result
